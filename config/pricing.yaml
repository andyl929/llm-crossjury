# Price table for cost estimation and the ledger.
#
# RULES
# - Every number in this file must be copied from the vendor's official pricing page
#   given in `source_url`, on the date given in `last_verified`.
# - Never fill a price from memory, a blog post, or another tool. If unsure, leave the
#   model out: llm-crossjury refuses to run unpriced models unless the budget explicitly
#   sets allow_unknown_cost: true.
# - Units: currency per 1,000,000 tokens.
# - A null rate means "not billed separately"; see PriceEntry in
#   src/llm_crossjury/core/cost/pricing.py for how each null is treated.
#
# This file intentionally ships with NO entries. Add the models you use.

schema_version: 1

entries: []

# Template (copy, uncomment, fill from the vendor page):
#
# - provider: anthropic            # anthropic | openai | gemini | xai
#   model: "<exact model id>"
#   backend: api
#   currency: USD
#   input_per_mtok: "<decimal>"
#   output_per_mtok: "<decimal>"
#   cached_input_per_mtok: null
#   cache_write_per_mtok: null
#   reasoning_per_mtok: null
#   batch_multiplier: null
#   source_url: "https://<vendor pricing page>"
#   last_verified: 2026-01-01
#   notes: null
