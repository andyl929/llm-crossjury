# Model registry (ADR 0006): the shipped, VERIFIED entries.
#
# Every value below was copied from the vendor's official documentation (see each
# entry's `source_url` and `notes`) on the date in `last_verified`. Never fill a model
# id, parameter or price from memory (AGENTS.md rule 4).
#
# Prices are USD per 1,000,000 tokens, `api` backend only. Where a vendor prices by
# prompt length, the LOWEST tier is used and `notes` says so. `cache_write_per_mtok`
# uses the shortest cache-write duration (noted per entry); `null` there means the
# vendor lists no separate cache-write price (writes billed as normal input).
#
# Override locally with `config/models.local.yaml` (git-ignored) or the
# LLM_CROSSJURY_MODELS environment variable. `config/models.example.yaml` illustrates
# every reasoning-control type with fictitious entries.

schema_version: 1

models:
  # ---------------------------------------------------------------- anthropic
  - provider: anthropic
    model_id: "claude-haiku-5-5"
    input_modalities: [image, pdf]   # verified 2026-11-08: platform.claude.com/docs/en/build-with-claude/pdf-support and /vision (supportedModels)
    backends: [api, cli]
    reasoning_control:
      type: levels
      parameter: "output_config.effort"
      allowed: ["low", "medium", "high", "xhigh", "max"]
      mapping: { low: "low", medium: "medium", high: "high" }
    cli_flags:   # https://code.claude.com/docs/en/cli-reference , /model-config (2026-11-08)
      model: ["--model", "{model}"]
      reasoning: ["--effort", "{value}"]
    context_window: 1000000
    max_output: 128000
    structured_output: true
    pricing:
      currency: USD
      input_per_mtok: "0.10"
      output_per_mtok: "0.50"
      cached_input_per_mtok: "0.01"
      cache_write_per_mtok: "0.125"
      reasoning_per_mtok: null
      batch_multiplier: "0.5"
    reasoning_multipliers: null
    source_url: "https://platform.claude.com/docs/en/about-claude/pricing"
    last_verified: 2026-11-08
    notes: >-
      Adaptive thinking; API default effort is medium. PROMPT-LENGTH TIERED: prices are the
      tier for prompts up to 100,000 tokens; over 100,000 tokens the whole request costs
      input 0.50 / 5m cache write 0.625 / cache read 0.05 / output 2.50. Cache write = 5-minute
      cache (1h write: 0.20). Thinking tokens are billed as output tokens. Batch API 50% off.
      Also: https://platform.claude.com/docs/en/about-claude/models/overview (id, 1M context,
      128K max output), https://platform.claude.com/docs/en/build-with-claude/effort (levels),
      https://platform.claude.com/docs/en/build-with-claude/structured-outputs,
      https://platform.claude.com/docs/en/build-with-claude/thinking (billing).

