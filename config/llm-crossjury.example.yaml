# Example run configuration. Copy to llm-crossjury.yaml and edit. This file holds no
# secrets (keys come from the environment only). Model ids are placeholders: fill
# them from each vendor's documentation.

members:
  - id: claude
    provider: anthropic
    model: "<anthropic model id>"
    backend: api
  - id: gpt
    provider: openai
    model: "<openai model id>"
    backend: api
  - id: gemini
    provider: gemini
    model: "<gemini model id>"
    backend: api
  - id: grok
    provider: xai
    model: "<xai model id>"
    backend: api

chair:
  id: chair
  provider: anthropic
  model: "<anthropic model id>"
  backend: api

review:
  topology: full          # full | ring | single_judge
  ring_k: 1
  judge: null             # member id for single_judge

budget:
  limit: "2.00"
  currency: USD
  allow_unknown_cost: false
  confirm_above: "0.50"

cost:
  use_prompt_cache: true
  use_batch: false
  early_stop_agreement: null   # e.g. 0.9 to skip review when answers agree

pricing_path: config/pricing.yaml
store_content: false      # true: keep prompts/responses in the user data dir
data_dir: null            # override platformdirs location
