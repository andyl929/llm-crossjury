<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm-crossjury Compare</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">llm-crossjury <span class="brand-mode">Compare</span></div>
    <div id="budget-summary" class="budget-summary" aria-live="polite"></div>
  </header>

  <main class="page">
    <section class="panel">
      <label for="task" class="section-label">Task</label>
      <textarea id="task" rows="6" spellcheck="true"
        placeholder="Ask a question or describe a task. Each selected model answers it independently."></textarea>
    </section>

    <section class="panel">
      <h2 class="section-label">Models</h2>
      <div id="providers" class="providers">
        <p class="muted">Loading providers...</p>
      </div>
    </section>

    <section class="panel actions-panel">
      <label id="consent-box" class="consent" hidden>
        <input type="checkbox" id="consent">
        <span id="consent-text">I understand: cost is unknown, calls count against my plan's usage limits, and this mode is experimental</span>
      </label>
      <div class="actions">
        <button id="estimate-btn" type="button" class="btn">Estimate cost</button>
        <button id="run-btn" type="button" class="btn btn-primary" disabled>Run</button>
        <span id="action-hint" class="muted">Pick at least one model, then estimate the cost.</span>
      </div>
      <div id="estimate" class="estimate" hidden></div>
    </section>

    <div id="message" class="message" role="alert" hidden></div>

    <section id="results-section" class="results-section" hidden>
      <div class="results-head">
        <h2>Results</h2>
        <div id="run-total" class="run-total"></div>
      </div>
      <div id="results" class="results"></div>
    </section>
    <section id="synthesis-section" class="panel synthesis" hidden>
      <div class="synth-head">
        <h2>AI synthesis</h2>
        <p class="muted">Measure agreement, let the models review each other anonymously, and have a chair model write one final answer.</p>
      </div>
      <div id="syn-unavailable" class="muted" hidden></div>
      <div id="syn-form" class="synth-form">
        <label for="syn-instructions" class="field-label">Extra instructions <span class="muted">(optional)</span></label>
        <textarea id="syn-instructions" rows="3" spellcheck="true"
          placeholder="Comparison criteria, or a follow-up question for the reviewers and the chair."></textarea>
        <div class="synth-row">
          <label class="field" for="syn-chair">
            <span class="field-label">Chair model</span>
            <select id="syn-chair"></select>
          </label>
          <fieldset class="field tier">
            <legend class="field-label">Review tier</legend>
            <label><input type="radio" name="syn-tier" value="economy" checked> Economy <span class="muted">fast models</span></label>
            <label><input type="radio" name="syn-tier" value="standard"> Standard <span class="muted">same models as above</span></label>
          </fieldset>
        </div>
        <label id="syn-consent-box" class="consent" hidden>
          <input type="checkbox" id="syn-consent">
          <span id="syn-consent-text">I understand: cost is unknown, calls count against my plan's usage limits, and this mode is experimental</span>
        </label>
        <div class="actions">
          <button id="syn-btn" type="button" class="btn btn-primary" disabled>AI synthesize</button>
          <span id="syn-status" class="muted" aria-live="polite"></span>
        </div>
        <details id="syn-breakdown" class="breakdown" hidden>
          <summary>Cost breakdown</summary>
          <div id="syn-breakdown-body"></div>
        </details>
      </div>
      <div id="syn-message" class="message" role="alert" hidden></div>
      <div id="syn-decision" class="decision" hidden></div>
      <div id="syn-result" class="synth-result" hidden></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
