[project]
name = "llm-crossjury"
version = "0.0.0"
description = "Run several LLMs on the same task, have them review each other anonymously, synthesize with a chair model, and let the user adjudicate disagreements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "anthropic>=2.6.0",
    "google-genai>=3.0.0",
    "openai>=3.46.0",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "pypdf>=7.0.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
]

[project.scripts]
llm-crossjury = "llm_crossjury.cli.app:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_crossjury"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.28.1",
]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds manual, possibly paid smoke scripts: never collected.
norecursedirs = [".*", ".venv", "scripts", "frontend", "prompts", "schemas", "docs"]
# Only loopback sockets are allowed (asyncio on Windows needs a loopback socketpair).
addopts = ["-ra", "--strict-markers", "--allow-hosts=127.0.0.1,::1"]
filterwarnings = [
    "error",
    "ignore:A test tried to use socket:UserWarning",  # emitted by pytest-socket on block
]
markers = [
    "smoke: end-to-end runs through the orchestrator with mock providers only",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913", # many-argument CLI commands are expected
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/llm_crossjury/cli/**" = ["PLR0917"]  # Typer maps parameters to options
"scripts/**" = ["S101"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
